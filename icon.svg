<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Nexa Store: a grid of apps on a GNOME-style base. The round tile carries the download arrow. -->
  <defs>
    <linearGradient id="base" x1="0" y1="40" x2="0" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33456b"/>
      <stop offset="1" stop-color="#1e2a45"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cb2f0"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fe8a0"/>
      <stop offset="1" stop-color="#2ec27e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc98a"/>
      <stop offset="1" stop-color="#ff9a38"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a7a"/>
      <stop offset="1" stop-color="#e5344a"/>
    </linearGradient>
  </defs>
  <!-- base with the darker bottom edge GNOME icons use for depth -->
  <rect x="32" y="56" width="448" height="424" rx="100" fill="#121a2c"/>
  <rect x="32" y="36" width="448" height="424" rx="100" fill="url(#base)"/>
  <rect x="33.5" y="37.5" width="445" height="421" rx="98.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3"/>
  <!-- tiles: a shade under each one, then the tile -->
  <g>
    <rect x="92" y="104" width="148" height="148" rx="40" fill="#0d1424" opacity="0.45"/>
    <rect x="92" y="94" width="148" height="148" rx="40" fill="url(#blue)"/>
    <rect x="272" y="104" width="148" height="148" rx="40" fill="#0d1424" opacity="0.45"/>
    <rect x="272" y="94" width="148" height="148" rx="40" fill="url(#green)"/>
    <rect x="92" y="284" width="148" height="148" rx="40" fill="#0d1424" opacity="0.45"/>
    <rect x="92" y="274" width="148" height="148" rx="40" fill="url(#orange)"/>
    <circle cx="346" cy="358" r="74" fill="#0d1424" opacity="0.45"/>
    <circle cx="346" cy="348" r="74" fill="url(#red)"/>
  </g>
  <!-- highlight on the top of each tile -->
  <g fill="#ffffff" opacity="0.22">
    <rect x="108" y="102" width="116" height="10" rx="5"/>
    <rect x="288" y="102" width="116" height="10" rx="5"/>
    <rect x="108" y="282" width="116" height="10" rx="5"/>
  </g>
  <!-- download arrow -->
  <path d="M346 308v66m-30-28 30 30 30-30" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
