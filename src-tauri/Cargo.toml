[package]
name = "nexa-store"
version = "0.8.0"
description = "Nexa Store: an app store for Debian, Ubuntu and their derivatives (APT, Flatpak, Snap and AppImage)"
license = "MIT"
repository = "https://github.com/Foglio24/nexa-store"
authors = ["Nexa Store"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "nexa_store_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
flate2 = "1"
base64 = "0.22"
quick-xml = "0.42"
tauri-plugin-single-instance = "2"
notify-rust = "4"
zbus = "5"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
strip = true
opt-level = "s"

